services:
  - type: web
    name: website-kb-chatbot
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python -m chatbot.ingestion
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_PERSIST_DIR
        value: ./chatbot/.chroma
      - key: KB_DIR
        value: ./chatbot/kb
    healthCheckPath: /api/v1/chatbot/health
