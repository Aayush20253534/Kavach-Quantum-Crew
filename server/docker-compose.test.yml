services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_tourist_safety_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_tourist_safety_test"]
      interval: 3s
      timeout: 3s
      retries: 10
